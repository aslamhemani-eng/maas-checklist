:root{--p:#5B2A86;--y:#FFD84D;--bg:#f7f3fb}

header{background:var(--p);color:#fff;padding:18px 16px 14px;position:sticky;top:0;z-index:5;box-shadow:0 2px 8px #0003}

.secbar{background:#e6dcef}.secbar i{background:var(--p)}
.tools{display:flex;flex-wrap:wrap;gap:8px;padding:12px 16px;max-width:900px;margin:auto}

button.on{background:var(--p);color:#fff}button.warn{border-color:#b33;color:#b33}

section{background:#fff;border-radius:14px;margin:14px 0;box-shadow:0 1px 4px #0001;overflow:hidden}
.sh{display:flex;align-items:center;gap:10px;padding:14px 16px;cursor:pointer;border-left:6px solid var(--y)}
.sh h2{margin:0;font-size:1.1rem;color:var(--p);flex:1}.cnt{font-weight:700;color:var(--p);white-space:nowrap}
.chev{transition:transform .2s;color:var(--p)}section.closed .chev{transform:rotate(-90deg)}section.closed .sb{display:none}
.sh .bar{width:100%;margin:0}.sb{padding:0 12px 14px}
h3{font-size:.95rem;margin:14px 4px 6px;color:var(--p);display:flex;justify-content:space-between}
.item{display:flex;gap:10px;align-items:flex-start;padding:10px 6px;border-bottom:1px solid #eee}
.item input[type=checkbox]{width:26px;height:26px;accent-color:var(--p);flex:none;margin-top:2px;cursor:pointer}
.item .t{flex:1;min-width:0}.item.done .tx{text-decoration:line-through;color:#888}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px;font-size:.78rem;align-items:center}
.b{padding:2px 8px;border-radius:20px;font-weight:700}.b.Aslam{background:var(--y);color:#3a2a00}.b.Staff{background:#d8ecff;color:#0b4a80}
.b.Volunteer{background:#dff5e1;color:#1d6b2a}.b.Assistant{background:#eadcf5;color:var(--p)}.due{color:#555}
.lnk{background:none;border:none;color:var(--p);min-height:32px;padding:2px 6px;font-size:.8rem;text-decoration:underline}
.del{color:#b33}textarea{width:100%;margin-top:6px;font:inherit;padding:8px;border-radius:8px;border:1px solid #ccc;min-height:44px}
.add{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;padding:10px;background:#faf6fd;border-radius:10px}
.add input,.add select{font:inherit;min-height:44px;padding:6px 10px;border:1px solid #bbb;border-radius:8px}.add input.tt{flex:1 1 220px}
.empty{color:#999;font-size:.85rem;padding:6px}

.sync{font-size:.8rem;margin-top:4px;color:var(--y)}#lock{border-color:var(--y)}</style></head><body>
